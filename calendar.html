<div class="gd-main">
  <header class="gd-topbar">
    <button type="button" class="gd-topbar__menu" id="gdMenuBtn" aria-label="Open menu" aria-controls="gdSidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

      <input type="search" id="gdSearch" placeholder="Search customers, jobs, invoices…" aria-label="Search">
    </form>
    <span class="gd-topbar__hint">Calendar</span>
  </header>

<main class="cal">
  <div class="cal__inner">

    <div class="leads__top">
      <div>
        <p class="tag">INTERNAL TOOL</p>
        <h1 class="leads__title">Schedule</h1>
        <p class="leads__subtitle">See who's booked and when, and keep recurring clients on autopilot.</p>
      </div>
      <div class="leads__top-actions">
        <button type="button" class="leads__add-btn" id="addBookingBtn">+ New booking</button>
      </div>
    </div>

    <div class="leads__stats" id="calStats"></div>

    <div class="cal__layout">
      <section class="cal__calendar" aria-label="Month calendar">
        <div class="cal__toolbar">
          <div class="cal__nav">
            <button type="button" class="cal__nav-btn" id="calPrevBtn" aria-label="Previous month">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M12 4 6 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h2 class="cal__month-label" id="calMonthLabel"></h2>
            <button type="button" class="cal__nav-btn" id="calNextBtn" aria-label="Next month">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M8 4 14 10l-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <button type="button" class="cal__today-btn" id="calTodayBtn">Today</button>
        </div>

        <div class="cal__weekdays">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="cal__grid" id="calGrid"></div>
      </section>

      <aside class="cal__agenda" aria-label="Upcoming bookings">
        <h3 class="cal__agenda-title">Coming up</h3>
        <div class="cal__agenda-list" id="agendaList"></div>
      </aside>
    </div>

  </div>
</main>
</div>

<!-- ============ ADD / EDIT BOOKING MODAL ============ -->
<div class="lead-modal" id="bookingModal" aria-hidden="true">
  <div class="lead-modal__backdrop" data-booking-modal-close></div>
  <div class="lead-modal__panel" role="dialog" aria-modal="true" aria-labelledby="bookingModalTitle">
    <button type="button" class="lead-modal__close" data-booking-modal-close aria-label="Close">&times;</button>
    <h3 id="bookingModalTitle">New booking</h3>
    <form class="form lead-modal__form" id="bookingForm" novalidate>
      <div class="form__fields">
        <label>
          <span>Import from a lead (optional)</span>
          <select id="bookingFromLead">
            <option value="">— choose a lead to auto-fill —</option>
          </select>
        </label>
        <div class="form__row">
          <label class="cal__autocomplete">
            <span>Client name</span>
            <input type="text" name="clientName" id="bookingClientName" required maxlength="100" placeholder="Jane Smith" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="clientSuggestions">
            <ul class="cal__suggestions" id="clientSuggestions" role="listbox" hidden></ul>
          </label>
          <label>
            <span>Phone</span>
            <input type="tel" name="phone" maxlength="30" autocomplete="tel" placeholder="(860) 555-0123">
          </label>
        </div>
        <div class="form__row">
          <label>
            <span>Service</span>
            <select name="service" id="bookingServiceSelect"></select>
          </label>
          <label>
            <span>Town</span>
            <input type="text" name="town" maxlength="100" autocomplete="address-level2" placeholder="e.g. Glastonbury, CT">
          </label>
        </div>
        <div class="form__row">
          <label>
            <span>Start date</span>
            <input type="date" name="startDate" required>
          </label>
          <label>
            <span>Time</span>
            <input type="time" name="time" required>
          </label>
        </div>
        <div class="form__row">
          <label>
            <span>Frequency</span>
            <select name="recurrence" id="bookingRecurrenceSelect">
              <option value="once">One-time visit</option>
              <option value="weekly">Weekly</option>
              <option value="biweekly">Every 2 weeks</option>
              <option value="monthly">Monthly</option>
            </select>
          </label>
          <label class="cal__end-date-field" id="bookingEndDateField">
            <span>Ends on (optional)</span>
            <input type="date" name="endDate">
          </label>
        </div>
        <div class="form__row">
          <label>
            <span>Payment</span>
            <select name="payment" id="bookingPaymentSelect">
              <option value="unpaid">Unpaid</option>
              <option value="paid">Paid</option>
            </select>
          </label>
        </div>
        <label>
          <span>What you're doing for them</span>
          <textarea name="notes" rows="3" maxlength="2000" placeholder="e.g. Weekly mow + edge, front and back"></textarea>
        </label>
      </div>
      <div class="lead-modal__actions">
        <button type="button" class="btn btn--outline" id="deleteBookingBtn" hidden>Delete booking</button>
        <button type="submit" class="btn btn--solid btn--block">Save booking</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ DAY DETAIL MODAL ============ -->
<div class="lead-modal" id="dayModal" aria-hidden="true">
  <div class="lead-modal__backdrop" data-day-modal-close></div>
  <div class="lead-modal__panel" role="dialog" aria-modal="true" aria-labelledby="dayModalTitle">
    <button type="button" class="lead-modal__close" data-day-modal-close aria-label="Close">&times;</button>
    <h3 id="dayModalTitle">Bookings</h3>
    <div class="cal__day-list" id="dayModalList"></div>
    <button type="button" class="btn btn--outline btn--block" id="dayModalAddBtn">+ Add a booking for this day</button>
  </div>
</div>
