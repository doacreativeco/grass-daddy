<div class="gd-sidebar-backdrop" id="gdSidebarBackdrop" hidden></div>

<div class="gd-main">
  <header class="gd-topbar">
    <button type="button" class="gd-topbar__menu" id="gdMenuBtn" aria-label="Open menu" aria-controls="gdSidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <form class="gd-topbar__search" id="gdSearchForm" role="search">
      <input type="search" id="gdSearch" placeholder="Search customers, jobs, invoices…" aria-label="Search">
    </form>
    <span class="gd-topbar__hint">Estimates</span>
  </header>

<main class="est">
  <div class="est__inner leads__inner">

    <div class="leads__top">
      <div>
        <p class="tag">INTERNAL TOOL</p>
        <h1 class="leads__title">Estimates</h1>
        <p class="leads__subtitle">Build a quote from the price list, send it, then convert accepted work to an invoice.</p>
      </div>
      <div class="leads__top-actions">
        <button type="button" class="leads__add-btn" id="newEstBtn">+ New estimate</button>
        <a href="prices.html" class="leads__export-btn">Price list</a>
      </div>
    </div>

    <div class="leads__stats" id="estStats"></div>

    <div class="bill__toolbar">
      <label class="leads__sort">
        <span>Client</span>
        <select class="leads__sort-select" id="estClientFilter" aria-label="Filter estimates by client"></select>
      </label>
      <label class="leads__sort">
        <span>Status</span>
        <select class="leads__sort-select" id="estStatusFilter" aria-label="Filter estimates by status">
          <option value="All">All</option>
          <option value="draft">Draft</option>
          <option value="sent">Sent</option>
          <option value="accepted">Accepted</option>
          <option value="declined">Declined</option>
        </select>
      </label>
    </div>

    <div id="estList"></div>

  </div>
</main>
</div>

<div class="lead-modal" id="estModal" aria-hidden="true">
  <div class="lead-modal__backdrop" data-est-modal-close></div>
  <div class="lead-modal__panel lead-modal__panel--wide" role="dialog" aria-modal="true" aria-labelledby="estModalTitle">
    <button type="button" class="lead-modal__close" data-est-modal-close aria-label="Close">&times;</button>
    <h3 id="estModalTitle">New estimate</h3>
    <form class="form lead-modal__form" id="estForm" novalidate>
      <div class="form__fields">
        <label>
          <span>Client</span>
          <select name="clientKey" id="estClientSelect" required></select>
        </label>
        <div class="form__row">
          <label>
            <span>Estimate date</span>
            <input type="date" name="date" id="estDateInput" required>
          </label>
          <label>
            <span>Status</span>
            <select name="status">
              <option value="draft">Draft</option>
              <option value="sent">Sent</option>
              <option value="accepted">Accepted</option>
              <option value="declined">Declined</option>
            </select>
          </label>
        </div>
        <div class="bill-lines">
          <div class="bill-lines__head">
            <h4>Line items</h4>
            <button type="button" class="leads__export-btn" id="addEstLineBtn">+ Add work</button>
          </div>
          <div id="estLines"></div>
          <p class="bill-lines__total">Total <strong id="estTotal">$0</strong></p>
        </div>
        <label>
          <span>Notes</span>
          <textarea name="notes" rows="2" maxlength="2000" placeholder="Scope, materials, or anything the customer should know"></textarea>
        </label>
      </div>
      <div class="lead-modal__actions">
        <button type="button" class="btn btn--outline" id="deleteEstBtn" hidden>Delete estimate</button>
        <button type="submit" class="btn btn--solid btn--block">Save estimate</button>
      </div>
    </form>
  </div>
</div>

<script src="js/modal-utils.js"></script>
<script src="js/work-convert.js"></script>
<script src="js/price-catalog.js"></script>
<script src="js/settings.js"></script>
<script src="js/estimates.js"></script>
</body>
</html>
